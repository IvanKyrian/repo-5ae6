<title>XMR Drawdown Explained</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work: a chart to defend one number in a PM discussion
   IDEA a newspaper explainer: one cumulative line with the event marked, then a zoom that shows the cause
   PICTURE cumulative funding P&L since inception with the spike and payback shaded; zoom of daily P&L and both venues' funding
   COLOUR white / near-black, blue for our P&L and Hyperliquid, orange for Binance, red only for losses
   TYPE Space Grotesk 700 + Inter, same as the screening page
   LAYOUT title and four figures on top, main chart full width, two zoom charts side by side, talking points beside the day table */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141414);--ink:light-dark(#191919,#efefef);--mute:light-dark(#666666,#9c9c9c);--rule:light-dark(#e6e6e6,#2c2c2c);--axis:light-dark(#bdbdbd,#4a4a4a);--s1:light-dark(#257de0,#338ced);--s2:light-dark(#f47230,#e76624);--neg:light-dark(#ec4647,#eb6263);--spike:light-dark(#257de01f,#338ced2e);--dd:light-dark(#ec464724,#eb626333);--tip:light-dark(#ffffff,#202020)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;margin:0;overflow-x:clip}
h1,h2,.big{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;line-height:1.05;margin:0}
h1{font-size:clamp(30px,4vw,46px);font-weight:700;max-width:22ch}
h2{font-size:20px;font-weight:700}
p{margin:0}
.band{padding-block:clamp(22px,3vw,40px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.lede{color:var(--mute);margin-top:12px;max-width:72ch}
.lede b{color:var(--ink);font-weight:600}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:16px 28px;margin-top:22px;border-top:1px solid var(--ink);padding-top:14px}
.big{font-size:clamp(26px,3vw,36px);font-weight:700;white-space:nowrap}
.figs small{display:block;font-size:13px;color:var(--mute);line-height:1.35;margin-top:4px}
.card{margin-top:clamp(22px,3vw,34px)}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.fig{position:relative;margin-top:10px}
.fig svg{display:block;width:100%;height:100%;overflow:visible}
#main{height:360px}
.z{height:300px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,40px)}
svg text{font:13px Inter,sans-serif;fill:var(--mute);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
svg text.lab{fill:var(--ink);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--tip);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.45;box-shadow:0 2px 8px #0002;white-space:nowrap;z-index:2}
.tip b{font-weight:600}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.notes{display:grid;grid-template-columns:minmax(0,640px);margin-top:clamp(26px,3vw,40px)}
ol{margin:10px 0 0;padding-left:20px}
li{margin-bottom:10px}
li::marker{color:var(--mute)}
.scroll{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:600;font-size:13px;color:var(--mute);text-align:right;padding:6px 8px;border-bottom:1px solid var(--ink)}
td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.sp td{background:var(--spike)}
tr.dd td{background:var(--dd)}
.neg{color:var(--neg)}
@media(max-width:820px){.two,.notes{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){#main{height:300px}.z{height:260px}table{font-size:13px}th,td{padding:5px 4px}}
</style>

<div class="band"><div class="wrap">
  <div class="two">
    <section>
      <h2>Daily funding P&amp;L, 20 Oct – 24 Nov</h2>
      <p class="sub">One day, 12 Nov, made more than the whole drawdown cost.</p>
      <div class="fig z" id="bars"></div>
    </section>

      <h2>What each venue paid, annualized</h2>
      <p class="sub">Hyperliquid spiked then went negative. Binance barely moved.</p>
      <div class="legend"><span><i style="background:var(--s1)"></i>Hyperliquid (we're short: we receive it)</span><span><i style="background:var(--s2)"></i>Binance (we're long: we pay it)</span></div>
      <div class="fig z" id="lines"></div>
    </section>
  </div>

  <div class="notes">
    <section>
      <h2>Day by day, 10–20 Nov</h2>
      <div class="scroll"><table id="tbl"></table></div>
    </section>
  </div>
</div></div>

  const d=r.p>=0?`M${x0},${top+h}V${top+rr}Q${x0},${top} ${x0+rr},${top}H${x0+ww-rr}Q${x0+ww},${top} ${x0+ww},${top+rr}V${top+h}Z`:`M${x0},${top}V${top+h-rr}Q${x0},${top+h} ${x0+rr},${top+h}H${x0+ww-rr}Q${x0+ww},${top+h} ${x0+ww},${top+h-rr}V${top}Z`;
  return `<path d="${d}" fill="${col}"/><rect class="h" data-i="${i}" x="${x(i)}" y="${m.t}" width="${bw}" height="${H-m.t-m.b}" fill="transparent"/>`}).join('');
 const iS=Z.findIndex(r=>r.d===SP[0]),iD=Z.findIndex(r=>r.d===DD[0]),iE=Z.findIndex(r=>r.d===DD[1]);
 const dates=Z.map((r,i)=>[r,i]).filter(([r])=>['2026-10-20','2026-11-01','2026-11-12','2026-11-24'].includes(r.d));
 w.innerHTML=`<svg><rect x="${x(iS)}" y="${m.t}" width="${bw*2}" height="${H-m.t-m.b}" fill="var(--spike)"/><rect x="${x(iD)}" y="${m.t}" width="${bw*(iE-iD+1)}" height="${H-m.t-m.b}" fill="var(--dd)"/>
 ${yt.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v?'var(--rule)':'var(--axis)'}"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${v<0?'−$'+(-v/1000)+'k':v?'$'+v/1000+'k':'$0'}</text>`).join('')}
 ${dates.map(([r,i])=>`<text x="${x(i)+bw/2}" y="${H-8}" text-anchor="middle">${md(r.d)}</text>`).join('')}
 ${bars}
 <text class="lab" x="${x(iS)-6}" y="${y(Z[iS].p)+12}" text-anchor="end">+$13.0k</text>
 <text class="lab" x="${x(iE)+bw+4}" y="${y(-2000)+4}">−$4.4k</text></svg>`;
 w.querySelectorAll('.h').forEach(h=>{h.addEventListener('pointermove',e=>{const b=w.getBoundingClientRect();tip(dayTip(Z[+h.dataset.i]),e.clientX-b.left,e.clientY-b.top)});h.addEventListener('pointerleave',()=>tip(null))});
});

// funding lines
chart('lines',Z,(w,W,H,tip)=>{
 const m={l:50,r:W<520?12:92,t:16,b:28};const lo=-100,hi=500;const y=v=>m.t+(hi-v)/(hi-lo)*(H-m.t-m.b);
 const x=i=>m.l+i/(Z.length-1)*(W-m.l-m.r);const yt=[-100,0,100,200,300,400,500];
 const ln=k=>Z.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(r[k]).toFixed(1)).join('');
 const iS=Z.findIndex(r=>r.d===SP[0]),iD=Z.findIndex(r=>r.d===DD[0]),iE=Z.findIndex(r=>r.d===DD[1]);const st=(W-m.l-m.r)/(Z.length-1);
 const dates=Z.map((r,i)=>[r,i]).filter(([r])=>['2026-10-20','2026-11-01','2026-11-12','2026-11-24'].includes(r.d));
 const L=Z[Z.length-1];
 w.innerHTML=`<svg><rect x="${x(iS)-st/2}" y="${m.t}" width="${st*2}" height="${H-m.t-m.b}" fill="var(--spike)"/><rect x="${x(iD)-st/2}" y="${m.t}" width="${st*(iE-iD+1)}" height="${H-m.t-m.b}" fill="var(--dd)"/>
 ${yt.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v?'var(--rule)':'var(--axis)'}"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${pct(v)}</text>`).join('')}
 ${dates.map(([r,i])=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${md(r.d)}</text>`).join('')}
 <path d="${ln('b')}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/>
 <path d="${ln('h')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
 <circle cx="${x(iS)}" cy="${y(Z[iS].h)}" r="4" fill="var(--s1)" stroke="var(--bg)" stroke-width="2"/>
 <text class="lab" x="${x(iS)-8}" y="${y(Z[iS].h)+5}" text-anchor="end">486%</text>
 <text x="${x(iD)+4}" y="${y(Z[iD].h)+18}">${pct(Z[iD].h)}</text>
 ${W>=520?`<text class="lab" x="${x(Z.length-1)+8}" y="${y(L.h)-6}">Hyperliquid</text><text class="lab" x="${x(Z.length-1)+8}" y="${y(L.b)+14}">Binance</text>`:''}
 <line id="lx" y1="${m.t}" y2="${H-m.b}" stroke="var(--axis)" visibility="hidden"/>
 <rect id="lh" x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent"/></svg>`;
 const sv=w.querySelector('svg'),lx=sv.querySelector('#lx');
 sv.querySelector('#lh').addEventListener('pointermove',e=>{const b=sv.getBoundingClientRect();let i=Math.round((e.clientX-b.left-m.l)/st);i=Math.max(0,Math.min(Z.length-1,i));lx.setAttribute('x1',x(i));lx.setAttribute('x2',x(i));lx.setAttribute('visibility','visible');tip(dayTip(Z[i]),x(i),e.clientY-b.top)});
 sv.querySelector('#lh').addEventListener('pointerleave',()=>{lx.setAttribute('visibility','hidden');tip(null)});
});

// table
const TR=D.filter(r=>r.d>='2026-11-10'&&r.d<='2026-11-20');
document.getElementById('tbl').innerHTML='<thead><tr><th>Day</th><th>Hyperliquid</th><th>Binance</th><th>Spread</th><th>P&amp;L</th><th>Cumulative</th></tr></thead><tbody>'+
 TR.map(r=>`<tr class="${SP.includes(r.d)?'sp':(r.d>=DD[0]&&r.d<=DD[1]?'dd':'')}"><td>${md(r.d)}</td><td${r.h<0?' class="neg"':''}>${pct(r.h)}</td><td>${pct(r.b)}</td><td${r.h-r.b<0?' class="neg"':''}>${pct(r.h-r.b)}</td><td${r.p<0?' class="neg"':''}>${usd(r.p)}</td><td>${usdp(r.c)}</td></tr>`).join('')+'</tbody>';
}
</script>
